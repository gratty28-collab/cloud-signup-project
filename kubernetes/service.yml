apiVersion: v1
kind: Service
metadata:
  name: signup-app-service
  annotations:
    # This explicitly forces AWS to provision a public, internet-facing load balancer
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
spec:
  type: LoadBalancer # Automatically creates an AWS Network Load Balancer
  selector:
    app: signup-app
  ports:
    - protocol: TCP
      port: 80        # External internet traffic port
      targetPort: 3000 # The port your Node.js app is listening on inside the container